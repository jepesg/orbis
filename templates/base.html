<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbis - {% block title %}{% endblock %}</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome (Ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Estilos Customizados -->
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="dark-theme">
    <!-- Área de conteúdo principal -->
    {% block content %}
    {% endblock %}

    <!-- Área para scripts adicionais -->
    {% block scripts %}
    {% endblock %}
    <script>
        (() => {
            const sidebar = document.querySelector('.sidebar');
            const backdrop = document.querySelector('.sidebar-backdrop');
            const buttons = document.querySelectorAll('.mobile-menu-toggle');
            if (!sidebar || !backdrop || !buttons.length) return;

            const setMenuOpen = (open) => {
                sidebar.classList.toggle('is-open', open);
                backdrop.classList.toggle('is-visible', open);
                buttons.forEach((button) => {
                    button.setAttribute('aria-expanded', String(open));
                    button.setAttribute('aria-label', open ? 'Fechar menu' : 'Abrir menu');
                    button.innerHTML = `<i class="fas ${open ? 'fa-times' : 'fa-bars'}" aria-hidden="true"></i>`;
                });
                document.body.classList.toggle('menu-open', open);
            };

            buttons.forEach((button) => button.addEventListener('click', () => {
                setMenuOpen(!sidebar.classList.contains('is-open'));
            }));
            backdrop.addEventListener('click', () => setMenuOpen(false));
            sidebar.querySelectorAll('.nav-link:not(.disabled)').forEach((link) => {
                link.addEventListener('click', () => setMenuOpen(false));
            });
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') setMenuOpen(false);
            });
            window.addEventListener('resize', () => {
                if (window.innerWidth > 768) setMenuOpen(false);
            });
        })();
    </script>
</body>
</html>
